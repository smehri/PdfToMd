[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftomd"
version = "0.1.0"
description = "Convert PDFs to Markdown so they cost fewer tokens as AI context."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Saeed Mehri" }]
keywords = ["pdf", "markdown", "ocr", "llm", "tokens", "converter"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

dependencies = [
    "PyMuPDF==1.24.10",
    "Pillow==10.4.0",
    "pytesseract==0.3.13",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
]

[project.urls]
Homepage = "https://github.com/smehri/PdfToMd"
Issues = "https://github.com/smehri/PdfToMd/issues"
Changelog = "https://github.com/smehri/PdfToMd/blob/main/CHANGELOG.md"

[project.scripts]
pdftomd = "pdftomd.cli:main"
pdftomd-ui = "pdftomd.server:main"

[tool.setuptools]
packages = ["pdftomd"]

[tool.setuptools.package-data]
pdftomd = ["static/*"]
